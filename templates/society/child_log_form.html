{% extends "society/base_society.html" %}
{% block title %}Child Log Form | eSociety{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block page_subtitle %}Fill child log details{% endblock %}

{% block content %}
  <div class="card full">
    <h3>{{ title }}</h3>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'society:child_log_list' %}" class="btn">Cancel</a>
    </form>
  </div>
{% endblock %}
